
### ========== IDLE MODULE ==========

set $lock_cmd swaylock -f -i ~/pics/wallpapers/earth-blurred.jpg

bindsym $mod+q exec $lock_cmd

exec swayidle -w \
    timeout 300 '$lock_cmd' \
    timeout 600 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    before-sleep '$lock_cmd'

### ========== END IDLE MODULE ==========