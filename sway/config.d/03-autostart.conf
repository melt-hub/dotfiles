### ========== AUTOSTART MODULE ==========

# Import essential environment variables into Systemd and D-Bus.
# This targeted approach is much faster than running --all.
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY \
    XDG_CURRENT_DESKTOP=sway GTK_USE_PORTAL=1
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY \
    XDG_CURRENT_DESKTOP GTK_USE_PORTAL

# Start UI components once at login.
# Waybar hot-reloads style.css and config automatically on save,
# so we do not need exec_always or pkill wrappers.
exec waybar
exec dunst

# Generate startup performance log 5 seconds after login
exec sleep 5 && ~/dotfiles/scripts/startup_monitor.sh &

### ========== END AUTOSTART MODULE ==========