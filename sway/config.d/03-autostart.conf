### ========== AUTOSTART MODULE ==========

# Export session environment variables to systemd and DBus
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_USE_PORTAL
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway GTK_USE_PORTAL=1

# Restart desktop portals asynchronously to register session variables
exec systemctl --user restart xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk &

# Launch user interface components asynchronously
exec waybar &
exec dunst &

# Monitor startup performance after session initialization
exec sleep 5 && ~/dotfiles/scripts/monitors/startup_monitor.sh &

### ========== END AUTOSTART MODULE ==========