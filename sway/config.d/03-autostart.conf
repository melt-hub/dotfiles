### ========== AUTOSTART MODULE ==========

# update d-bus environment
exec dbus-update-activation-environment --all

# ui components
exec_always "pkill waybar || true; waybar > /dev/null 2>&1 &"
exec_always "pkill dunst || true; dunst &"

# eye protection
exec gammastep -l 45.4:9.1 -t 5700:3600 -g 0.8 -m wayland &

### ========== END AUTOSTART MODULE ==========