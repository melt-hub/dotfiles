### ========== AUTOSTART MODULE ==========

# Import essential environment variables asynchronously to avoid blocking Sway startup.
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway GTK_USE_PORTAL=1

# Start UI components
exec waybar
exec dunst

# Generate startup performance log 5 seconds after login
exec sleep 5 && ~/dotfiles/scripts/monitors/startup_monitor.sh &

### ========== END AUTOSTART MODULE ==========